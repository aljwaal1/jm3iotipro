name: Build APK Direct

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - jamiyati-pro-v3-redesign
    paths-ignore:
      - "apk/**"
      - "DOWNLOAD_APK.md"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --org com.explapp --no-pub .

      - name: Remove generated sample tests
        run: |
          rm -rf test
          rm -f analysis_options.yaml

      - name: Configure Android application
        shell: bash
        run: |
          set -e
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = ".*"/applicationId = "com.explapp.jamiyati"/g' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
            sed -i 's/minSdk = [0-9][0-9]*/minSdk = 23/g' android/app/build.gradle.kts
            python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          marker = 'dependencies {'
          dep = '    implementation("androidx.fragment:fragment-ktx:1.9.0")\n'
          if marker in s and dep.strip() not in s:
              s = s.replace(marker, marker + '\n' + dep)
          elif marker not in s:
              s += '\n\ndependencies {\n' + dep + '}\n'
          p.write_text(s)
          PY
          fi

      - name: Configure FragmentActivity for biometric authentication
        shell: bash
        run: |
          mkdir -p android/app/src/main/kotlin/com/explapp/jamiyati
          cat > android/app/src/main/kotlin/com/explapp/jamiyati/MainActivity.kt <<'KOTLIN'
          package com.explapp.jamiyati
          import io.flutter.embedding.android.FlutterFragmentActivity
          class MainActivity: FlutterFragmentActivity()
          KOTLIN

      - name: Configure premium native launch theme
        shell: bash
        run: |
          cat > android/app/src/main/res/values/colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="jamiyati_launch_bg">#07110F</color></resources>
          XML
          cat > android/app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">@color/jamiyati_launch_bg</item>
                  <item name="android:navigationBarColor">@color/jamiyati_launch_bg</item>
              </style>
              <style name="NormalTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">@color/jamiyati_launch_bg</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">@color/jamiyati_launch_bg</item>
                  <item name="android:navigationBarColor">@color/jamiyati_launch_bg</item>
              </style>
          </resources>
          XML
          if [ -d android/app/src/main/res/values-night ]; then
            cp android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml
          fi
          cat > android/app/src/main/res/drawable/launch_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><shape android:shape="rectangle"><solid android:color="@color/jamiyati_launch_bg" /></shape></item>
          </layer-list>
          XML
          if [ -d android/app/src/main/res/drawable-v21 ]; then
            cp android/app/src/main/res/drawable/launch_background.xml android/app/src/main/res/drawable-v21/launch_background.xml
          fi

      - name: Write AndroidManifest
        shell: bash
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
              <queries>
                  <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>
                  <intent><action android:name="android.intent.action.SEND" /><data android:mimeType="*/*" /></intent>
                  <intent><action android:name="android.intent.action.SENDTO" /><data android:scheme="mailto" /></intent>
              </queries>
              <application
                  android:label="جمعيتي Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          MANIFEST

      - name: Get packages
        run: flutter pub get

      - name: Analyze source without CI source patching
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --target lib/app_entry.dart --no-tree-shake-icons

      - name: Copy APK to repository folder
        if: github.event_name == 'push'
        run: |
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/jamiyati.apk
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/raw/${GITHUB_REF_NAME}/apk/jamiyati.apk"
          printf '# رابط تحميل تطبيق جمعيتي Pro\n\nحمّل APK مباشرة:\n\n%s\n' "$APK_URL" > DOWNLOAD_APK.md
          printf '## رابط تحميل APK\n\n%s\n' "$APK_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit APK
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apk/jamiyati.apk DOWNLOAD_APK.md
          if git diff --cached --quiet; then
            echo "APK already up to date"
          else
            git commit -m "ci: update Jamiyati Pro APK"
            git push
          fi
